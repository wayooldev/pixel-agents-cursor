[package]
name = "pixel-agents-desktop"
version = "0.1.0"
description = "One-click Windows shell for the Pixel Agents standalone office"
authors = ["Pixel Agents"]
edition = "2021"

[lib]
name = "pixel_agents_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json"] }
which = "6"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
